version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "0.0.0.0:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  postgres-backend:
    image: postgres:15
    environment:
      POSTGRES_DB: locator_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "0.0.0.0:6379:6379"

  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:16.0
    depends_on:
      - odoo-db
    ports:
      - "192.168.137.1:8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo

volumes:
  postgres-backend-data:
  odoo-db-data:
  odoo-web-data:


