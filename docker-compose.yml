services:
  db-odoo:
    image: postgres:15-alpine
    container_name: odoo_postgres
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoopassword
      POSTGRES_DB: odoo_db
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: odoo_erp
    restart: always
    depends_on:
      db-odoo:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db-odoo
      USER: odoo
      PASSWORD: odoopassword
    command: odoo -d odoo_db --without-demo=all
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

  fastapi-backend:
    build: ./backend
    container_name: locator_fastapi
    restart: always
    depends_on:
      db-odoo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://odoo:odoopassword@db-odoo:5432/odoo_db
    ports:
      - "8000:8000"

volumes:
  odoo_db_data:
  odoo_web_data: