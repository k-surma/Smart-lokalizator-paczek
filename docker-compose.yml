version: '3.8'

services:
  postgres-backend:
    image: postgres:15
    container_name: locator_postgres
    restart: always
    environment:
      POSTGRES_DB: locator_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
      - ./backend/models/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    container_name: locator_redis
    restart: always
    ports:
      - "0.0.0.0:6379:6379"

  odoo-db:
    image: postgres:15
    container_name: locator_odoo_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:16.0
    container_name: locator_odoo
    restart: always
    depends_on:
      - odoo-db
    ports:
      - "0.0.0.0:8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo_module:/mnt/extra-addons

volumes:
  postgres-backend-data:
  odoo-db-data:
  odoo-web-data: